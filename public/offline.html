<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0a0a">
    <title>Hors connexion · GameNight</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0a0a0a; color: #f4f4f5; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; }
      main { width: min(100%, 32rem); padding: 2rem; border: 1px solid #333; border-radius: 1rem; background: #141414; }
      h1 { margin-top: 0; font-size: 1.5rem; }
      p { color: #c4c4cc; line-height: 1.6; }
      a { display: inline-block; margin-top: 1rem; padding: .75rem 1rem; border-radius: .6rem; background: #8b5cf6; color: white; font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Tu es hors connexion</h1>
      <p>GameNight ne conserve pas les pages ni les données de ton compte sur cet appareil. Rétablis ta connexion pour retrouver tes soirées et ta communauté.</p>
      <a href="/">Réessayer</a>
    </main>
  </body>
</html>
