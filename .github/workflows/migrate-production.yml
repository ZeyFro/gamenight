name: Migrations Production

on:
  push:
    branches: [main]
    paths:
      - "prisma/migrations/**"
      - "prisma/schema.prisma"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    # Un lancement manuel depuis une autre branche ne doit jamais atteindre le secret Production.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-migrations
    # Le secret n'est exposé qu'aux étapes qui parlent à la base : jamais à npm ci ni à ses scripts d'installation.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Vérifier le secret et l'URL directe
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Secret PRODUCTION_MIGRATION_DATABASE_URL absent."
            exit 1
          fi
          case "$DATABASE_URL" in
            *-pooler*)
              echo "::error::L'URL contient -pooler : utiliser l'URL directe Neon."
              exit 1
              ;;
          esac
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Point de restauration Neon
        shell: bash
        run: |
          {
            echo "## Point de restauration Neon"
            echo
            echo "Heure UTC avant migration : $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: État avant migration
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
        run: npx prisma migrate status || true
      - name: Appliquer les migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
        run: npx prisma migrate deploy
      - name: État après migration
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
        run: npx prisma migrate status
      - name: Reprise du déploiement Vercel après migration réussie
        if: ${{ success() }}
        shell: bash
        env:
          # Facultatif : secret de l'environnement production-migrations. Sans lui, redéployer à la main.
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${VERCEL_DEPLOY_HOOK_URL:-}" ]; then
            {
              echo "## Déploiement Vercel"
              echo
              echo "Migration appliquée. Aucun Deploy Hook configuré : redéployer le dernier commit de main dans Vercel (Redeploy). Le build passera la garde de migration."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # -f : échec sur HTTP 4xx/5xx ; -S sans -v : l'URL du hook n'est jamais affichée ; réponse écartée.
          if curl -fsS -X POST --max-time 30 -o /dev/null "$VERCEL_DEPLOY_HOOK_URL"; then
            message="Migration appliquée, Deploy Hook appelé : un nouveau déploiement de main est lancé. Vérifier qu'il passe la garde de migration."
          else
            # La migration a réussi : un hook en échec ne doit pas passer pour un échec de migration.
            echo "::warning::Deploy Hook Vercel en échec : redéployer à la main."
            message="Migration appliquée, mais le Deploy Hook a échoué : redéployer le dernier commit de main dans Vercel (Redeploy)."
          fi
          {
            echo "## Déploiement Vercel"
            echo
            echo "$message"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Consignes en cas d'échec
        if: ${{ failure() }}
        shell: bash
        run: |
          {
            echo "## Échec de la migration Production"
            echo
            echo "- Ne pas relancer à l'aveugle : Prisma refuse toute nouvelle application (P3009) tant qu'une migration échouée n'est pas résolue."
            echo "- Lire l'étape « État avant migration » et l'erreur de « Appliquer les migrations »."
            echo "- Une migration SQL multi-instructions s'exécute dans une transaction PostgreSQL : un échec ne laisse pas de changement partiel."
            echo "- Marquer la migration comme annulée (prisma migrate resolve --rolled-back <nom>) seulement après contrôle manuel, puis corriger par une nouvelle migration."
            echo "- Restauration Neon à l'heure UTC du résumé « Point de restauration Neon » : seulement sur décision du propriétaire. Voir docs/MIGRATIONS.md."
          } >> "$GITHUB_STEP_SUMMARY"
