name: Tower team daily challenge

on:
  schedule:
    # 07:00 UTC is 09:00 CEST; 08:00 UTC is 09:00 CET.
    # The job calls the endpoint only during 09:00 Europe/Paris.
    - cron: "0 7,8 * * *"

permissions:
  contents: read

concurrency:
  group: tower-team-daily-challenge
  cancel-in-progress: false

jobs:
  assign-daily-challenges:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the daily challenge endpoint
        env:
          GAMENIGHT_CRON_BASE_URL: ${{ vars.GAMENIGHT_CRON_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$GAMENIGHT_CRON_BASE_URL" || -z "$CRON_SECRET" ]]; then
            echo "Required repository variable or secret is missing."
            exit 1
          fi

          if [[ ! "$GAMENIGHT_CRON_BASE_URL" =~ ^https://[^/]+/?$ ]]; then
            echo "GAMENIGHT_CRON_BASE_URL must be an HTTPS origin."
            exit 1
          fi

          paris_hour="$(TZ=Europe/Paris date +%H)"
          if [[ "$paris_hour" != "09" ]]; then
            echo "Skipping UTC schedule slot outside 09:00 Europe/Paris."
            exit 0
          fi

          endpoint="${GAMENIGHT_CRON_BASE_URL%/}/api/cron/tower-team-daily"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          for attempt in 1 2 3; do
            if ! status="$(curl --silent --output "$response_file" --write-out '%{http_code}' \
              --max-time 40 --request GET \
              --header "Authorization: Bearer ${CRON_SECRET}" "$endpoint")"; then
              echo "The endpoint request failed or timed out."
              exit 1
            fi

            if [[ "$status" == "503" ]]; then
              if [[ "$attempt" -lt 3 ]]; then
                echo "Endpoint returned HTTP 503; retry $((attempt + 1))/3."
                sleep "$((attempt * 15))"
                continue
              fi
              echo "Endpoint returned HTTP 503 on all 3 attempts."
              exit 1
            fi

            if [[ "$status" != "200" ]]; then
              echo "Endpoint returned unexpected HTTP status $status."
              exit 1
            fi

            if ! jq -e '.enabled == true and .failed == 0' "$response_file" >/dev/null; then
              echo "Endpoint did not confirm enabled=true and failed=0."
              exit 1
            fi

            echo "Daily team challenge assignment completed successfully."
            exit 0
          done
