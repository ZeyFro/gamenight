name: Précontrôle Production (lecture seule)

# Lancement manuel uniquement, depuis main, avec l'approbation de l'environnement.
# Aucune écriture : transaction READ ONLY, compteurs seulement dans le résumé du run.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  precheck:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-migrations
    # Le secret n'est exposé qu'aux étapes de contrôle : jamais à npm ci ni à ses scripts d'installation.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Contrôle des équipes (lecture seule)
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
        run: |
          set +e
          output="$(node scripts/precheck-team-membership.mjs 2>&1)"
          code=$?
          set -e
          {
            echo "## Précontrôle Production (lecture seule)"
            echo
            echo '```'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$output"
          exit "$code"
      # Simulation de la garde de build en application stricte : prouve que le schéma est à jour et que la
      # connexion de lecture fonctionne. Si le secret facultatif MIGRATION_GATE_DATABASE_URL (rôle dédié en
      # SELECT seul) existe dans l'environnement, c'est lui qui est testé ; sinon l'URL de migration.
      - name: Garde de build, simulation stricte (lecture seule)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          VERCEL_ENV: production
          MIGRATION_GATE_ENFORCE: "true"
          MIGRATION_GATE_DATABASE_URL: ${{ secrets.MIGRATION_GATE_DATABASE_URL }}
        run: |
          set +e
          output="$(node scripts/assert-migrations-applied.mjs 2>&1)"
          code=$?
          set -e
          {
            echo "## Garde de build : simulation stricte"
            echo
            echo '```'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$output"
          exit "$code"
      # Empreinte (compteurs et dates) à comparer avec la même requête exécutée sur une branche Neon restaurée.
      - name: Empreinte de restauration (lecture seule)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
        run: |
          set +e
          output="$(node scripts/restore-fingerprint.mjs 2>&1)"
          code=$?
          set -e
          {
            echo "## Empreinte de la base (lecture seule)"
            echo
            echo '```'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$output"
          exit "$code"
